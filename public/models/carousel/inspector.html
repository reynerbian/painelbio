<!-- Inspector Form: Modelo Fullscreen Carousel (Estilo Instagram) -->
<form id="inspector-form" class="inspector-form">

    <!-- Navegação por Abas Internas -->
    <div class="inspector-tabs-container" style="display: flex; gap: 8px; margin-bottom: 16px; padding: 4px; background: rgba(0,0,0,0.4); border-radius: 12px; border: 1px solid rgba(255,255,255,0.08);">
        <button type="button" class="inspector-tab-btn active" data-tab="content" style="flex: 1; padding: 9px 12px; border: none; border-radius: 8px; font-weight: 700; font-size: 0.8rem; cursor: pointer; background: #3b82f6; color: #fff; transition: all 0.2s;">📝 Conteúdo</button>
        <button type="button" class="inspector-tab-btn" data-tab="addons" style="flex: 1; padding: 9px 12px; border: none; border-radius: 8px; font-weight: 700; font-size: 0.8rem; cursor: pointer; background: transparent; color: #94a3b8; transition: all 0.2s;">🧩 Add ons</button>
    </div>

    <!-- PAINEL 1: CONTEÚDO PRINCIPAL -->
    <div id="panel-content" class="inspector-panel active">
        
        <!-- Bloco 1: Carrossel 3 Fotos Tela Cheia -->
        <div style="background: rgba(236, 72, 153, 0.08); border: 1px solid rgba(236, 72, 153, 0.25); border-radius: 12px; padding: 12px; margin-bottom: 16px;">
            <label style="font-size: 0.85rem; font-weight: 700; color: #ec4899; display: block; margin-bottom: 8px;">📸 Fotos do Carrossel (3 Imagens em Tela Cheia):</label>
            
            <div class="form-group" style="margin-bottom: 10px;">
                <label for="input-carousel1-img" style="font-size: 0.75rem; color: #f472b6;">Foto 1 de Fundo (URL):</label>
                <input type="text" id="input-carousel1-img" placeholder="URL da Foto 1 (ex: https://...)">
            </div>

            <div class="form-group" style="margin-bottom: 10px;">
                <label for="input-carousel2-img" style="font-size: 0.75rem; color: #f472b6;">Foto 2 de Fundo (URL):</label>
                <input type="text" id="input-carousel2-img" placeholder="URL da Foto 2 (ex: https://...)">
            </div>

            <div class="form-group" style="margin-bottom: 0;">
                <label for="input-carousel3-img" style="font-size: 0.75rem; color: #f472b6;">Foto 3 de Fundo (URL):</label>
                <input type="text" id="input-carousel3-img" placeholder="URL da Foto 3 (ex: https://...)">
            </div>
        </div>

        <!-- Bloco 2: Perfil do Instagram -->
        <div class="form-group">
            <label for="input-avatar">Foto de Perfil / Avatar:</label>
            <div class="input-with-button">
                <input type="text" id="input-avatar" placeholder="URL da imagem (ex: https://...)">
                <button type="button" id="btn-search-avatar" class="form-button">Buscar</button>
            </div>
        </div>

        <div class="form-group">
            <label for="input-name">Nome da Loja / Marca:</label>
            <input type="text" id="input-name" placeholder="Ex: Studio Beauty | Estética">
        </div>

        <div class="form-group">
            <label for="input-arroba">@ do Instagram:</label>
            <input type="text" id="input-arroba" placeholder="Ex: studiobeauty.oficial">
        </div>

        <div class="form-group">
            <label for="input-bio">Texto da Bio / Apresentação:</label>
            <textarea id="input-bio" placeholder="Ex: Especialista em extensão de cílios..."></textarea>
            
            <div class="align-buttons-container" style="display: flex; gap: 8px; margin-top: 8px;">
                <button type="button" class="align-btn active" data-align="left" aria-label="Alinhar à Esquerda">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="21" y1="6" x2="3" y2="6"></line><line x1="15" y1="12" x2="3" y2="12"></line><line x1="21" y1="18" x2="3" y2="18"></line></svg>
                </button>
                <button type="button" class="align-btn" data-align="center" aria-label="Alinhar ao Centro">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="21" y1="6" x2="3" y2="6"></line><line x1="17" y1="12" x2="7" y2="12"></line><line x1="21" y1="18" x2="3" y2="18"></line></svg>
                </button>
                <button type="button" class="align-btn" data-align="right" aria-label="Alinhar à Direita">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="21" y1="6" x2="3" y2="6"></line><line x1="21" y1="12" x2="9" y2="12"></line><line x1="21" y1="18" x2="3" y2="18"></line></svg>
                </button>
            </div>
        </div>

        <!-- Bloco 3: Botões da Bio (4 Botões) -->
        <div class="form-group">
            <label for="input-btn1-title">Título do Botão 1 (Principal):</label>
            <input type="text" id="input-btn1-title" placeholder="Ex: 💬 Agendar no WhatsApp">
        </div>
        <div class="form-group">
            <label for="input-btn1-url">URL do Botão 1:</label>
            <input type="text" id="input-btn1-url" placeholder="Ex: https://wa.me/5511999999999">
        </div>

        <div class="form-group">
            <label for="input-btn2-title">Título do Botão 2:</label>
            <input type="text" id="input-btn2-title" placeholder="Ex: 🛍️ Ver Tabela de Preços">
        </div>
        <div class="form-group">
            <label for="input-btn2-url">URL do Botão 2:</label>
            <input type="text" id="input-btn2-url" placeholder="Ex: https://wa.me/5511999999999">
        </div>

        <div class="form-group">
            <label for="input-btn3-title">Título do Botão 3:</label>
            <input type="text" id="input-btn3-title" placeholder="Ex: 📍 Nossa Localização">
        </div>
        <div class="form-group">
            <label for="input-btn3-url">URL do Botão 3:</label>
            <input type="text" id="input-btn3-url" placeholder="Ex: https://maps.google.com">
        </div>

        <div class="form-group">
            <label for="input-btn4-title">Título do Botão 4:</label>
            <input type="text" id="input-btn4-title" placeholder="Ex: ✨ Seguir no Instagram">
        </div>
        <div class="form-group" style="margin-bottom: 16px;">
            <label for="input-btn4-url">URL do Botão 4:</label>
            <input type="text" id="input-btn4-url" placeholder="Ex: https://instagram.com">
        </div>

        <!-- Container para Add-ons Ativados -->
        <div id="active-addons-list"></div>

    </div>

    <!-- PAINEL 2: CATÁLOGO DE ADD-ONS -->
    <div id="panel-addons" class="inspector-panel" style="display: none;"></div>

    <button type="submit" id="btn-save-inspector" class="save-button" style="margin-top: 16px;">Salvar Site</button>
</form>
