<form id="inspector-form" class="inspector-form">
    <!-- Abas de Navegação no Inspector: Conteúdo vs Add ons -->
    <div class="inspector-tabs-container" style="display: flex; gap: 8px; margin-bottom: 16px; padding: 4px; background: rgba(0,0,0,0.4); border-radius: 12px; border: 1px solid rgba(255,255,255,0.08);">
        <button type="button" class="inspector-tab-btn active" data-tab="content" style="flex: 1; padding: 9px 12px; border: none; border-radius: 8px; font-weight: 700; font-size: 0.8rem; cursor: pointer; background: #3b82f6; color: #fff; transition: all 0.2s;">📝 Conteúdo</button>
        <button type="button" class="inspector-tab-btn" data-tab="addons" style="flex: 1; padding: 9px 12px; border: none; border-radius: 8px; font-weight: 700; font-size: 0.8rem; cursor: pointer; background: transparent; color: #94a3b8; transition: all 0.2s;">🧩 Add ons</button>
    </div>

    <!-- Painel 1: Conteúdo Principal do Site (E Add-ons Ativos do Projeto) -->
    <div id="panel-content" class="inspector-panel active">
        
        <!-- Bloco 1: Informações de Perfil -->
        <div style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 12px; margin-bottom: 16px;">
            <label style="font-size: 0.85rem; font-weight: 700; color: #fff; display: block; margin-bottom: 8px;">👤 Perfil da Bio:</label>
            
            <div class="form-group" style="margin-bottom: 10px;">
                <label for="input-avatar">Foto de Perfil / Avatar:</label>
                <div class="input-with-button">
                    <input type="text" id="input-avatar" placeholder="Cole a URL da foto">
                    <button type="button" class="form-button" onclick="triggerAvatarUpload ? triggerAvatarUpload() : null">Buscar</button>
                </div>
            </div>
            
            <div class="form-group" style="margin-bottom: 10px;">
                <label for="input-name">Nome da Loja / Marca:</label>
                <input type="text" id="input-name" placeholder="Ex: Ana C. | Infoprodutora">
            </div>
            
            <div class="form-group" style="margin-bottom: 10px;">
                <label for="input-arroba">@ do Instagram:</label>
                <input type="text" id="input-arroba" placeholder="Ex: ananutri.oficial">
            </div>
            
            <div class="form-group" style="margin-bottom: 0;">
                <label for="input-bio">Texto da Bio / Apresentação:</label>
                <textarea id="input-bio" placeholder="Escreva a sua biografia curta..."></textarea>
            </div>
        </div>

        <!-- Bloco 2: E-book 1 (Principal) -->
        <div style="background: rgba(59, 130, 246, 0.08); border: 1px solid rgba(59, 130, 246, 0.25); border-radius: 12px; padding: 12px; margin-bottom: 16px;">
            <label style="font-size: 0.85rem; font-weight: 700; color: #60a5fa; display: block; margin-bottom: 8px;">📖 E-book 1 (Destaque Principal):</label>
            
            <div class="form-group" style="margin-bottom: 10px;">
                <label for="input-ebook-cover">Foto da Capa:</label>
                <input type="text" id="input-ebook-cover" placeholder="Cole a URL da imagem da capa">
            </div>

            <div class="form-group" style="margin-bottom: 10px;">
                <label for="input-ebook-title">Título:</label>
                <input type="text" id="input-ebook-title" placeholder="Ex: Guia de Emagrecimento Definitivo">
            </div>

            <div class="form-group" style="margin-bottom: 10px;">
                <label for="input-ebook-desc">Descrição:</label>
                <textarea id="input-ebook-desc" placeholder="Ex: Aprenda as melhores estratégias e receitas sem passar fome de forma simples e direta."></textarea>
            </div>

            <div class="form-group" style="margin-bottom: 10px;">
                <label for="input-ebook-btn-text">Texto do Botão:</label>
                <input type="text" id="input-ebook-btn-text" placeholder="Ex: Comprar E-book 🛒">
            </div>

            <div class="form-group" style="margin-bottom: 0;">
                <label for="input-ebook-buy-url">Link de Compra:</label>
                <input type="text" id="input-ebook-buy-url" placeholder="Ex: https://pay.hotmart.com/...">
            </div>
        </div>

        <!-- Bloco 3: E-book 2 -->
        <div style="background: rgba(139, 92, 246, 0.08); border: 1px solid rgba(139, 92, 246, 0.25); border-radius: 12px; padding: 12px; margin-bottom: 16px;">
            <label style="font-size: 0.85rem; font-weight: 700; color: #a78bfa; display: block; margin-bottom: 8px;">📚 E-book 2 (Opcional):</label>
            
            <div class="form-group" style="margin-bottom: 10px;">
                <label for="input-ebook2-cover">Foto da Capa:</label>
                <input type="text" id="input-ebook2-cover" placeholder="Cole a URL da imagem da capa">
            </div>

            <div class="form-group" style="margin-bottom: 10px;">
                <label for="input-ebook2-title">Título:</label>
                <input type="text" id="input-ebook2-title" placeholder="Ex: Receitas Fit Rápidas">
            </div>

            <div class="form-group" style="margin-bottom: 10px;">
                <label for="input-ebook2-desc">Descrição:</label>
                <textarea id="input-ebook2-desc" placeholder="Ex: Guia prático com 50 opções de cafés da manhã e jantares de até 15 minutos."></textarea>
            </div>

            <div class="form-group" style="margin-bottom: 10px;">
                <label for="input-ebook2-btn-text">Texto do Botão:</label>
                <input type="text" id="input-ebook2-btn-text" placeholder="Ex: Garantir E-book 🛒">
            </div>

            <div class="form-group" style="margin-bottom: 0;">
                <label for="input-ebook2-buy-url">Link de Compra:</label>
                <input type="text" id="input-ebook2-buy-url" placeholder="Ex: https://pay.hotmart.com/...">
            </div>
        </div>

        <!-- Bloco 4: E-book 3 -->
        <div style="background: rgba(236, 72, 153, 0.08); border: 1px solid rgba(236, 72, 153, 0.25); border-radius: 12px; padding: 12px; margin-bottom: 16px;">
            <label style="font-size: 0.85rem; font-weight: 700; color: #f472b6; display: block; margin-bottom: 8px;">📚 E-book 3 (Opcional):</label>
            
            <div class="form-group" style="margin-bottom: 10px;">
                <label for="input-ebook3-cover">Foto da Capa:</label>
                <input type="text" id="input-ebook3-cover" placeholder="Cole a URL da imagem da capa">
            </div>

            <div class="form-group" style="margin-bottom: 10px;">
                <label for="input-ebook3-title">Título:</label>
                <input type="text" id="input-ebook3-title" placeholder="Ex: Guia de Treinos de Casa">
            </div>

            <div class="form-group" style="margin-bottom: 10px;">
                <label for="input-ebook3-desc">Descrição:</label>
                <textarea id="input-ebook3-desc" placeholder="Ex: Rotinas de exercícios rápidas e eficientes para fazer na sala de casa."></textarea>
            </div>

            <div class="form-group" style="margin-bottom: 10px;">
                <label for="input-ebook3-btn-text">Texto do Botão:</label>
                <input type="text" id="input-ebook3-btn-text" placeholder="Ex: Acessar Guia 🛒">
            </div>

            <div class="form-group" style="margin-bottom: 0;">
                <label for="input-ebook3-buy-url">Link de Compra:</label>
                <input type="text" id="input-ebook3-buy-url" placeholder="Ex: https://pay.hotmart.com/...">
            </div>
        </div>

        <!-- Bloco 5: Botões Extras (Suporte, etc) -->
        <div style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 12px; margin-bottom: 16px;">
            <label style="font-size: 0.85rem; font-weight: 700; color: #fff; display: block; margin-bottom: 8px;">🔗 Links Adicionais (Opcional):</label>
            
            <div class="form-group" style="margin-bottom: 10px;">
                <label for="input-btn1-title">Título do Botão Extra 1:</label>
                <input type="text" id="input-btn1-title" placeholder="Ex: 💬 Falar no WhatsApp (Suporte)">
            </div>
            <div class="form-group" style="margin-bottom: 10px;">
                <label for="input-btn1-url">URL do Botão Extra 1:</label>
                <input type="text" id="input-btn1-url" placeholder="Ex: https://wa.me/...">
            </div>

            <div class="form-group" style="margin-bottom: 10px;">
                <label for="input-btn2-title">Título do Botão Extra 2:</label>
                <input type="text" id="input-btn2-title" placeholder="Ex: 🌐 Visitar Site Oficial">
            </div>
            <div class="form-group" style="margin-bottom: 0;">
                <label for="input-btn2-url">URL do Botão Extra 2:</label>
                <input type="text" id="input-btn2-url" placeholder="Ex: https://meusite.com.br">
            </div>
        </div>

        <!-- AREA DE ADD-ONS ATIVOS NO PROJETO -->
        <div id="active-addons-list">
        </div>
    </div>

    <!-- Painel 2: Add ons (Catálogo Limpo de Adição) -->
    <div id="panel-addons" class="inspector-panel" style="display: none;">
    </div>

    <!-- Resumo do Orçamento (Carrinho) -->
    <div style="margin-top: 20px; margin-bottom: 16px;">
        <hr style="border: none; border-top: 1px dashed rgba(255,255,255,0.2); margin-bottom: 12px;">
        <div id="cart-summary" style="padding: 0 4px;">
            <!-- Conteúdo será gerado via JS -->
            <div style="display: flex; justify-content: space-between; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 6px;">
                <span id="cart-model-name">Modelo E-book</span>
                <span id="cart-model-price">R$ 14,99</span>
            </div>
            <div id="cart-addons-list"></div>
            <!-- Taxa de Serviço (mão de obra) -->
            <div id="cart-service-fee-row" style="display: none; align-items: center; justify-content: space-between; margin-top: 6px; margin-bottom: 2px;">
                <label style="font-size: 0.78rem; color: #f59e0b; white-space: nowrap;">🔧 Taxa de Serviço:</label>
                <div style="display: flex; align-items: center; gap: 4px;">
                    <span style="font-size: 0.78rem; color: #f59e0b;">R$</span>
                    <input type="number" id="cart-service-fee" min="0" step="0.01" value="0" placeholder="0,00"
                        style="width: 70px; background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.4); color: #f59e0b; border-radius: 6px; padding: 4px 6px; font-size: 0.82rem; text-align: right;"
                        oninput="if(this.value < 0) this.value = 0; if(typeof updateCartSummary==='function') updateCartSummary()" />
                </div>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 0.95rem; font-weight: 700; color: #fff; margin-top: 8px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 8px;">
                <span>Total a Cobrar:</span>
                <span id="cart-total-price" style="color: #10b981;">R$ 14,99</span>
            </div>
        </div>
        <hr style="border: none; border-top: 1px dashed rgba(255,255,255,0.2); margin-top: 12px;">
    </div>

    <!-- Botão de Salvar -->
    <button type="submit" id="btn-save-inspector" class="save-button" style="margin-top: 8px;">Salvar Site</button>
</form>
